<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minecraft Boost</title><style>*{box-sizing:border-box}html,body{margin:0;background:#070b0a;color:white;font-family:system-ui,Arial,sans-serif;height:100%}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#070b0a}video{width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;inset:0;background:linear-gradient(145deg,#102b22ee,#060807ee);display:grid;place-items:center;z-index:2}.panel{width:min(90vw,410px);text-align:center;padding:30px;border:1px solid #427d62;border-radius:20px;background:#101a16;box-shadow:0 18px 80px #0009}h1{font-size:2rem;margin:0 0 8px;color:#8ff5b1}p{line-height:1.5;color:#c7d5cd}button{cursor:pointer;background:#58d58b;border:0;color:#06140c;border-radius:12px;padding:14px 20px;font-size:1rem;font-weight:800}button.secondary{background:#273a30;color:#fff}.buttons{display:flex;gap:12px;justify-content:center;margin-top:22px}.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 16px;background:#101a16df;border:1px solid #547763;border-radius:16px;z-index:1;max-width:95vw;flex-wrap:wrap;justify-content:center}input{accent-color:#65eaa0}small{color:#b9cfc2}.hidden{display:none}</style></head><body><main class="screen"><video id="video" src="video.mp4" playsinline loop preload="auto"></video><div id="overlay" class="overlay"><div class="panel"><h1>⛏ Minecraft Boost</h1><p>Nhấn để phát video với âm thanh được khuếch đại và thử mở toàn màn hình.</p><div class="buttons"><button id="accept">Accept</button><button class="secondary" id="no">No</button></div><p><small>Hai nút đều bắt đầu video. Hãy chỉnh âm lượng thiết bị ở mức dễ chịu.</small></p></div></div></main><div class="controls hidden" id="controls"><button id="toggle">⏸ Tạm dừng</button><label>Âm thanh <strong id="gainText">150%</strong> <input id="gain" type="range" min="100" max="300" value="150" step="10"></label><button id="full">⛶ Toàn màn hình</button></div><script>const video=document.getElementById('video'),overlay=document.getElementById('overlay'),controls=document.getElementById('controls'),gain=document.getElementById('gain'),gainText=document.getElementById('gainText');let ctx,boost;function audio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();let source=ctx.createMediaElementSource(video);boost=ctx.createGain();let limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-8;limiter.knee.value=0;limiter.ratio.value=20;limiter.attack.value=.003;limiter.release.value=.15;source.connect(boost).connect(limiter).connect(ctx.destination);boost.gain.value=1.5}async function start(){audio();await ctx.resume();video.muted=false;video.volume=1;overlay.classList.add('hidden');controls.classList.remove('hidden');try{await video.play()}catch(e){console.log(e)}try{await document.documentElement.requestFullscreen()}catch(e){/* Some browsers require a separate fullscreen gesture */}}document.getElementById('accept').onclick=start;document.getElementById('no').onclick=start;gain.oninput=()=>{gainText.textContent=gain.value+'%';if(boost)boost.gain.value=Number(gain.value)/100};document.getElementById('toggle').onclick=()=>{if(video.paused){video.play();document.getElementById('toggle').textContent='⏸ Tạm dừng'}else{video.pause();document.getElementById('toggle').textContent='▶ Phát'}};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){if(video.webkitEnterFullscreen)video.webkitEnterFullscreen()}};</script></body></html>
